name: _terraform

# Reusable: fmt/init/validate + plan or apply for a single root module (leaf).
# Called by aws.yml (and any future per-provider caller). Never runs on its own.
on:
  workflow_call:
    inputs:
      working_directory:
        description: Root module directory to run in (e.g. aws/billing).
        required: true
        type: string
      apply:
        description: Apply instead of plan.
        required: false
        type: boolean
        default: false
      environment:
        description: GitHub Environment to gate the run (e.g. prod). Empty = no gate.
        required: false
        type: string
        default: ""
    secrets:
      cloudflare_api_token:
        description: Cloudflare API token, exposed as TF_VAR_cloudflare_api_token. Only the cloudflare/ leaves need it; AWS callers omit it.
        required: false
      ovh_application_key:
        description: OVH API application key, exposed as TF_VAR_ovh_application_key. Only the ovh/ leaves need it.
        required: false
      ovh_application_secret:
        description: OVH API application secret, exposed as TF_VAR_ovh_application_secret. Only the ovh/ leaves need it.
        required: false
      ovh_consumer_key:
        description: OVH API consumer key (scoped rights — see the ovh/ leaf README), exposed as TF_VAR_ovh_consumer_key. Only the ovh/ leaves need it.
        required: false
      ovh_cloud_project_service:
        description: OVH Public Cloud project ID (service_name), exposed as TF_VAR_ovh_cloud_project_service. Only the ovh/ leaves need it.
        required: false

permissions:
  contents: read
  id-token: write # request the OIDC token

env:
  AWS_REGION: eu-central-1 # STS/default region only; each provider sets its own region
  TF_VERSION: "1.10.5"

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # Non-AWS provider auth (Cloudflare, OVH). Empty for leaves that don't need a given
    # provider (e.g. AWS leaves get none of these) — the provider block is simply never
    # initialized for them. AWS creds for the shared S3 backend come via OIDC below,
    # regardless of which provider(s) a leaf uses.
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.cloudflare_api_token }}
      TF_VAR_ovh_application_key: ${{ secrets.ovh_application_key }}
      TF_VAR_ovh_application_secret: ${{ secrets.ovh_application_secret }}
      TF_VAR_ovh_consumer_key: ${{ secrets.ovh_consumer_key }}
      TF_VAR_ovh_cloud_project_service: ${{ secrets.ovh_cloud_project_service }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        if: ${{ !inputs.apply }}
        run: terraform plan -input=false -no-color

      - name: Apply
        if: ${{ inputs.apply }}
        run: terraform apply -input=false -auto-approve
